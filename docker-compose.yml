services:
  postgres:
    image: postgres:16-alpine
    container_name: compsphere_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: compsphere
      POSTGRES_USER: compsphere
      POSTGRES_PASSWORD: compsphere_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compsphere -d compsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: compsphere_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@compsphere.id
      PGADMIN_DEFAULT_PASSWORD: compsphere_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
